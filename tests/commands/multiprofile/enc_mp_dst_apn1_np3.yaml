# Multi-profile: destination, append profile name, 3 profiles
# Expected: All files have profile name suffix (video_x265-balanced.mkv, etc.)

mode: encode
profiles:
  - x265-balanced
  - x265-fast
  - x264-compatible
source: $root_media/original/
output_mode: destination
destination: $root_media/encoded/multiprofile/
append_profile_name: true
recursive: false
file_patterns:
  - "*.mkv"
  - "*.mp4"
