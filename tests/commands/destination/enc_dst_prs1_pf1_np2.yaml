# Destination mode, preserve structure, profile folders, 2 profiles
# Expected: encoded/<structure>/x265-balanced/ and $ncoded/<structure>/x265-fast/

mode: encode
profiles:
  - x265-balanced
  - x265-fast
source: $root_media/original/
output_mode: destination
destination: $root_media/encoded/
preserve_structure: true
create_profile_folders: true
recursive: true
file_patterns:
  - "*.mkv"
  - "*.mp4"
