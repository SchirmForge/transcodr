# Destination mode, delete source after encoding, single profile
# Expected: Output to encoded/, source file DELETED
# WARNING: Use with replace/ to avoid deleting original files!

mode: encode
profile: x265-balanced
source: replace/
output_mode: destination
destination: $root_media/encoded/
delete_source: true
recursive: false
file_patterns:
  - "*.mkv"
  - "*.mp4"
