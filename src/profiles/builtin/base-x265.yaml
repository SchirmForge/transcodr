# Base x265 profile
# This profile provides common x265 settings that other profiles can extend

name: base-x265
description: Base x265 encoding profile with VAAPI hardware acceleration

container: mkv

video:
  codec: libx265
  pix_fmt: yuv420p10le  # 10-bit color depth for better quality

audio:
  copy: true  # Copy audio streams without re-encoding

subtitles:
  copy: true  # Copy subtitle streams

# Hardware acceleration variants
hardware_variants:
  vaapi:
    video:
      codec: hevc_vaapi
      hwaccel: vaapi
      hwaccel_device: /dev/dri/renderD128
      extra_options:
        qp: "23"

tags:
  - base
  - x265
  - vaapi
