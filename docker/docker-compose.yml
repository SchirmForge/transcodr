
services:
  transcodr:
    image: schirmforge/transcodr:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${TRANSCODR_PORT:-8765}:8765"
    user: "${TRANSCODR_USER:-1000:1000}"
    volumes:
      - ${TRANSCODR_CONFIG_VOL}:/config    # Config, profiles, watchfolders, jobs.db
      - ${TRANSCODR_MEDIA_VOL}:/media      # root_media mount
      - ${TRANSCODR_TEMP_VOL}:/temp        # Temp encoding directory
      - ${TRANSCODR_LOGS_VOL}:/logs        # Logs folder (set logging.dir to /logs in config.yaml)

    environment:
      - TRANSCODR_CONFIG_DIR=/config
    restart: unless-stopped

    # ─── GPU Passthrough (uncomment one section) ───────────────────────
    #
    # VAAPI (AMD/Intel GPU):
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
